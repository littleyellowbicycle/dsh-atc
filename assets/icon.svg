<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Agent 空管中心">
  <title>Agent 空管中心</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2437"/>
      <stop offset="1" stop-color="#090d15"/>
    </linearGradient>
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="8.6" y1="0" x2="15.4" y2="0">
      <stop offset="0" stop-color="#7d93b8"/>
      <stop offset="0.45" stop-color="#d3e0f5"/>
      <stop offset="1" stop-color="#6f86ac"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="14" y1="4" x2="21.2" y2="15">
      <stop offset="0" stop-color="#6f9bf7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6f9bf7" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0a44a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f0a44a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>

  <!-- tracked contacts: one per agent on the fleet -->
  <g filter="url(#glow)" opacity="0.4">
    <circle cx="60" cy="60" r="8" fill="#4c7cf3"/>
    <circle cx="33" cy="99" r="8" fill="#2f9e6f"/>
    <circle cx="29" cy="141" r="8" fill="#d98324"/>
    <circle cx="46" cy="180" r="8" fill="#7c5cf0"/>
    <circle cx="78" cy="208" r="8" fill="#e05fa8"/>
  </g>
  <g>
    <circle cx="60" cy="60" r="6" fill="#4c7cf3"/>
    <circle cx="33" cy="99" r="6" fill="#2f9e6f"/>
    <circle cx="29" cy="141" r="6" fill="#d98324"/>
    <circle cx="46" cy="180" r="6" fill="#7c5cf0"/>
    <circle cx="78" cy="208" r="6" fill="#e05fa8"/>
  </g>

  <!-- the tower, same glyph as the sidebar row -->
  <g transform="translate(118 128) scale(9.5) translate(-12 -8.7)">
    <!-- broadcast waves -->
    <g fill="none" stroke="url(#wave)" stroke-linecap="round">
      <path d="M16.9 6.2a4.2 4.2 0 0 1 0 6.1" stroke-width="1.15"/>
      <path d="M19.1 4.1a7.4 7.4 0 0 1 0 10.3" stroke-width="0.95" opacity="0.6"/>
    </g>
    <!-- mast + antenna -->
    <g fill="none" stroke="url(#steel)" stroke-width="1.05" stroke-linecap="round">
      <path d="M12 2.4v2.6"/>
      <rect x="9" y="5" width="6" height="2.8" rx="1" fill="#c9d8f2" fill-opacity="0.18"/>
      <path d="M10.2 7.8 9.4 15M13.8 7.8 14.6 15"/>
      <path d="M8.6 15h6.8"/>
    </g>
  </g>

  <!-- beacon on the antenna -->
  <circle cx="118" cy="68" r="13" fill="url(#lamp)"/>
  <circle cx="118" cy="68" r="4" fill="#f0a44a"/>
</svg>
